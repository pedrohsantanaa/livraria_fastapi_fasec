<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca FastAPI</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1>📚 Biblioteca FastAPI</h1>

        <div class="card">

            <h2>Novo Livro</h2>

            <form id="formLivro">

                <input type="text" id="titulo" placeholder="Título" required>

                <input type="text" id="autor" placeholder="Autor" required>


                <input type="text" id="ano_publicacao" placeholder="Ano de Publicação" required>

                <button type="submit">
                    Salvar
                </button>

            </form>

        </div>

        <div class="card">

            <h2>Livros Cadastrados</h2>

            <div id="listaLivros"></div>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
